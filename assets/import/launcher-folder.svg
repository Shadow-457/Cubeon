<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Installed game folder</title>
  <desc>Cubeon-style instance folder with an emerald block and controller badge.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd141"/>
      <stop offset="1" stop-color="#2f8a22"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f7a24"/>
      <stop offset="1" stop-color="#1f5a19"/>
    </linearGradient>
  </defs>
  <!-- soft ground shadow -->
  <ellipse cx="48" cy="85" rx="32" ry="4" fill="#000" opacity=".25"/>
  <!-- back panel + tab -->
  <path d="M12 29a8 8 0 0 1 8-8h18l9 9h29a8 8 0 0 1 8 8v33a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8Z" fill="url(#back)"/>
  <!-- emerald block rising from the folder -->
  <g>
    <polygon points="32,22 48,30 48,52 32,44" fill="#3f9a2c"/>
    <polygon points="64,22 48,30 48,52 64,44" fill="#2c721f"/>
    <polygon points="48,14 64,22 48,30 32,22" fill="#7fe85f"/>
    <polygon points="48,14 64,22 48,30 32,22" fill="none" stroke="#c4ffa8" stroke-opacity=".5"/>
    <rect x="44" y="19" width="4" height="4" fill="#c4ffa8" opacity=".85"/>
    <rect x="50" y="22" width="3" height="3" fill="#c4ffa8" opacity=".5"/>
  </g>
  <!-- sparkles -->
  <rect x="22" y="14" width="3" height="3" fill="#9fe88a"/>
  <rect x="73" y="11" width="4" height="4" fill="#c4ffa8"/>
  <rect x="78" y="25" width="2" height="2" fill="#9fe88a"/>
  <!-- front panel -->
  <path d="M12 40h72v31a8 8 0 0 1-8 8H20a8 8 0 0 1-8-8Z" fill="url(#front)"/>
  <path d="M12 40h72" stroke="#a6f58a" stroke-width="2"/>
  <!-- pixel studs along the bottom -->
  <g fill="#1f5a19" opacity=".55">
    <rect x="18" y="72" width="4" height="4"/><rect x="26" y="72" width="4" height="4"/>
    <rect x="66" y="72" width="4" height="4"/><rect x="74" y="72" width="4" height="4"/>
  </g>
  <!-- controller badge -->
  <rect x="29" y="46" width="38" height="24" rx="7" fill="#12301a"/>
  <rect x="29.5" y="46.5" width="37" height="23" rx="6.5" fill="none" stroke="#4fcf34" stroke-opacity=".5"/>
  <g fill="#c4ffa8" shape-rendering="crispEdges">
    <rect x="35" y="57" width="10" height="3"/><rect x="38.5" y="53.5" width="3" height="10"/>
    <rect x="55" y="53" width="4" height="4"/><rect x="59" y="59" width="4" height="4" fill="#6be04a"/>
  </g>
  <metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
