name: Build Cubeon (AppImage & Windows EXE)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

# Builds run read-only by default; only the build jobs that attach binaries
# to a GitHub release get contents:write (tag builds only).
permissions:
  contents: read

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Java 21 (mod compile test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run test suite
        env:
          # The harnesses are hermetic (sandboxed game dir), but set it
          # explicitly so a stray write can never touch CI's real HOME.
          CUBEON_GAME_DIR: /tmp/cubeon-game-ci
        run: |
          set -e
          failed=0
          for t in tools/test_*.py; do
            # Gradle-based jar assembly needs network + minutes; compile
            # checking (test_mod_compile) stays, building does not.
            case "$t" in
              tools/test_visual_*.py) echo "skip (manual) $t"; continue;;
            esac
            echo "::group::$t"
            # Each script gets a fresh game directory. Several suites create
            # realistic jars/profile state; sharing one directory makes a
            # later test see an earlier test's files and fail nondeterministically.
            export CUBEON_GAME_DIR="/tmp/cubeon-game-ci-$RANDOM-$RANDOM"
            rm -rf "$CUBEON_GAME_DIR"
            if ! python3 "$t"; then
              echo "::error::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  build-linux-appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh
          python packaging/build_linux_installers.py

      - name: Upload Linux AppImage Artifact
        # Publish artifacts only for tagged releases. A single run's
        # artifacts (AppImage + Windows ZIP + macOS bundle) are ~400-500 MB,
        # which is the WHOLE free Actions storage quota - uploading them on
        # every main push filled it up (19 GB of stale builds) and then made
        # every upload fail with "Artifact storage quota has been hit".
        # Branch runs still BUILD (so the build itself stays verified); only
        # releases keep the binaries.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Cubeon-Linux-x86_64-AppImage
          path: dist/Cubeon-x86_64.AppImage

      - name: Attach Linux AppImage to the GitHub release
        # Release ASSETS do not count against the Actions artifact storage
        # quota (artifacts do, and the free quota is smaller than one run's
        # builds). On a tag build, publish the binary straight to the release.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Cubeon $GITHUB_REF_NAME" \
            --notes "Automated build of $GITHUB_REF_NAME." \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" dist/Cubeon-x86_64.AppImage --clobber

      - name: Attach Debian package to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Globbed, not hardcoded: packaging/build_deb.py names the package
        # dist/cubeon_<APP_VERSION>_amd64.deb, so a hardcoded name drifts out
        # of date on every release and fails the upload. This step was still
        # pointing at 1.0.0 while the app was on 1.0.1.
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/cubeon_*_amd64.deb)
          if [ ${#debs[@]} -eq 0 ]; then
            echo "no dist/cubeon_*_amd64.deb to upload" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${debs[@]}" --clobber

      - name: Attach Linux setup script to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Cubeon-Linux-x86_64-Setup.sh --clobber

  build-windows-exe:
    name: Build Windows EXE & ZIP
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows EXE & ZIP
        run: |
          python packaging/build_windows.py
          python packaging/build_windows_installer.py

      - name: Upload Windows Standalone Folder Artifact
        # OFF deliberately: the ZIP below contains the same folder, and the
        # unpacked copy is ~128 MB of the ~500 MB free storage quota. See the
        # note on the Linux upload step.
        if: false
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Cubeon-Windows-x64-Folder
          path: dist/Cubeon/

      - name: Upload Windows Portable ZIP Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Cubeon-Windows-x64-ZIP
          path: dist/Cubeon-Windows-x64.zip

      - name: Attach Windows ZIP to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Cubeon $GITHUB_REF_NAME" \
            --notes "Automated build of $GITHUB_REF_NAME." \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" dist/Cubeon-Windows-x64.zip --clobber

      - name: Attach Windows installer to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/Cubeon-Windows-x64-Setup.exe --clobber

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build macOS app bundle
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Attach macOS app to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/Cubeon Cubeon-macOS.zip
          gh release create "$GITHUB_REF_NAME" \
            --title "Cubeon $GITHUB_REF_NAME" \
            --notes "Automated build of $GITHUB_REF_NAME." \
            --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" Cubeon-macOS.zip --clobber
