name: Build & publish Cubeon binaries

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run the extended test suite (up to 30 minutes)
        type: boolean
        required: false
        default: false

# One release per push to main/master (2026-10-17).
#
#   * the `release` job decides the version, stamps it into the tree, tags the
#     commit and opens a DRAFT release. tools/release_version.py owns the
#     policy - read its docstring before touching the version scheme;
#   * every build job stamps the same version into its own checkout and uploads
#     its assets to that draft (`gh release upload`, drafts are writable);
#   * `publish` verifies ALL assets landed, then un-drafts the release (marking
#     it Latest only if it is ahead of what is already public, so re-publishing
#     an older build can't move /releases/latest backwards). Nothing is
#     user-visible until then, which is the whole point: /releases/latest feeds
#     both the in-app updater and worker/cubeon-downloads.js, so a half-uploaded
#     release would offer a download that 404s.
#   * a human-made TAG push (v*) skips the version maths entirely: the tag IS
#     the version, and it gets the same draft -> verify -> publish treatment.
#
# Why the tag has to equal the compiled-in APP_VERSION: cubeon/updater.py
# compares the feed's tag against the APP_VERSION baked into the user's build
# (`_TAG_RE`, strict vX.Y.Z). A tag ahead of the binary's own version means
# every user is told an update is available forever. That is what `stamp` -
# run by every job before its build - exists to prevent, and why the release
# job commits the stamp back to main ([skip ci], so it can't recurse).
#
# The release job deliberately does NOT wait on `test`/`test-windows`: two
# suites (test_fuzz.py, test_install_cancel.py) are load-flaky on CI, and a
# flaky red test silently dropping a release is worse than shipping it (the
# run is still red either way). Flip that by adding `needs: [test,
# test-windows]` to `release` if the trade ever changes.
permissions:
  contents: read

env:
  # Pin the repository for every API/upload call, including before checkout.
  GH_REPO: ${{ github.repository }}

concurrency:
  # Two pushes a few seconds apart would otherwise both compute the same "next
  # version" (the first run has not created its tag yet) and race for it.
  # Serialising per ref makes the second run see the first one's tag - and the
  # tag push in the `release` job is an atomic lock anyway, so the worst case
  # is a bumped version, never two releases sharing a tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ inputs.full_tests && 'Full test suite' || 'Quick regression checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full_tests && 30 || 5 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Java 21 (mod compile test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check public APIs
        run: |
          node worker/test-cosmetics.mjs
          node worker/test-neon-cosmetics.cjs
          node worker/test-online.mjs
          node tools/test_website_store.cjs

      - name: Run test suite
        env:
          FULL_TEST_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_tests }}
          # The harnesses are hermetic (sandboxed game dir), but set it
          # explicitly so a stray write can never touch CI's real HOME.
          CUBEON_GAME_DIR: /tmp/cubeon-game-ci
        run: |
          set -euo pipefail
          failed=0
          if [[ "$FULL_TEST_SUITE" == "true" ]]; then
            tests=(tools/test_*.py)
            test_timeout=120
          else
            # Keep source/UI smoke, pack preservation, discovery, resolver,
            # companion archive/compile and release contracts on every push.
            # Fuzz campaigns and installed-game probes belong to explicit runs.
            tests=(
              tools/test_mega_smoke.py
              tools/test_startup.py
              tools/test_source_runtime.py
              tools/test_desktop_runtime.py
              tools/test_runtime_libraries.py
              tools/test_webdoctor.py
              tools/test_cosmetics_picker.py
              tools/test_skin_loading.py
              tools/test_settings_polish.py
              tools/test_fuzzy_search.py
              tools/test_modpack_search.py
              tools/test_mod_search.py
              tools/test_mod_resolver.py
              tools/test_mod_prelaunch_dependencies.py
              tools/test_content_checks.py
              tools/test_modpack_integrity.py
              tools/test_perf_loader_support.py
              tools/test_game_feature_switches.py
              tools/test_modpacks.py
              tools/test_modpacks_cf_keyless.py
              tools/test_mod_matrix.py
              tools/test_mod_compile.py
              tools/test_peer_skins.py
              tools/test_chat_ux.py
              tools/test_auto_update.py
              tools/test_release_version.py
              tools/test_release_pipeline.py
            )
            test_timeout=60
          fi
          for t in "${tests[@]}"; do
            # Gradle-based jar assembly needs network + minutes; compile
            # checking (test_mod_compile) stays, building does not.
            case "$t" in
              tools/test_visual_*.py) echo "skip (manual) $t"; continue;;
              tools/test_cosmetic_elytra_native.py|tools/test_cosmetic_store_native.py|tools/test_live_cape_native.py|tools/test_client_263_native.py|tools/test_gif_capes_native.py|tools/test_lod_native.py|tools/test_rust_engine_native.py|tools/test_rust_profile_native.py)
                echo "skip (installed game + graphical desktop) $t"; continue;;
              tools/test_camera_blur_gpu.py)
                echo "skip (local OpenGL/EGL GPU probe) $t"; continue;;
              tools/test_webdoctor_browser.py|tools/test_website_browser.py)
                echo "skip (opt-in Playwright browser checks) $t"; continue;;
              # Spawns REAL flet GUI clients (wedge detector + software-GL
              # ladder); has no display on CI and fails there identically
              # (documented 2026-10-14: fails the same on a clean tree).
              tools/test_wedge_watchdog.py) echo "skip (headless CI) $t"; continue;;
            esac
            echo "::group::$t"
            # Each script gets a fresh game directory. Several suites create
            # realistic jars/profile state; sharing one directory makes a
            # later test see an earlier test's files and fail nondeterministically.
            export CUBEON_GAME_DIR="/tmp/cubeon-game-ci-$RANDOM-$RANDOM"
            rm -rf "$CUBEON_GAME_DIR"
            if ! timeout "$test_timeout" python3 "$t"; then
              echo "::error::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

  test-windows:
    # The window-reveal and splash-ordering fixes were unverifiable from Linux,
    # and Windows is where the "process runs but no window appears" report came
    # from. This re-runs the startup-critical, OS-agnostic harnesses on a real
    # Windows runner. Extended suites are opt-in on Ubuntu; running all of
    # them on Windows would duplicate a lot for little extra signal.
    name: Startup tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Java 21 (javaw native probe)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run startup-critical tests
        # Also exercise real javaw argument/log/exit behavior on Windows.
        shell: pwsh
        run: |
          $failed = 0
          $tests = @(
            "tools/test_startup.py",
            "tools/test_winwindow.py",
            "tools/test_game_environment.py",
            "tools/test_mod_prelaunch_dependencies.py"
          )
          foreach ($t in $tests) {
            # Startup initializes instance storage; a later suite must not
            # inherit its registry or mod fixtures.
            $env:CUBEON_GAME_DIR = Join-Path $env:RUNNER_TEMP ("cubeon-game-ci-win-" + [guid]::NewGuid().ToString("N"))
            Write-Host "::group::$t"
            python $t
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$t failed"
              $failed = 1
            }
            Write-Host "::endgroup::"
          }
          if ($failed -ne 0) { exit 1 }

  release:
    name: Decide the version + open the draft release
    # An explicitly requested full test run must not also rebuild all platforms.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Tags ARE the version history this job reads, and --generate-notes
          # diffs against the previous release, so it needs the commits too.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide the version, stamp it, tag it, open the draft
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force --quiet

          # GitHub can fail a ref write after accepting the branch's objects, or
          # accept the tag and lose the response. Retry the same tag and commit;
          # only a confirmed different target is a version collision.
          reserve_tag() {
            local commit="$1" tag="$2" remote attempt
            for attempt in 1 2 3 4 5; do
              if git push origin "$commit:refs/tags/$tag" >/tmp/tagpush.log 2>&1; then
                return 0
              fi
              remote="$(git ls-remote --refs origin "refs/tags/$tag" 2>/dev/null)" || remote=""
              remote="${remote%%$'\t'*}"
              if [ "$remote" = "$commit" ]; then
                echo "$tag already points at the intended commit"
                return 0
              elif [ -n "$remote" ]; then
                return 2
              fi
              if grep -qiE 'authentication failed|permission.*denied|repository not found|protected tag|GH013' /tmp/tagpush.log; then
                break
              fi
              if [ "$attempt" -lt 5 ]; then
                echo "::warning::tag write failed; retrying $tag at the same commit (attempt $attempt/5)"
                sleep "$((1 << (attempt - 1)))"
              fi
            done
            cat /tmp/tagpush.log >&2
            echo "::error::could not create the tag $tag"
            return 1
          }

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # A human cut this tag on purpose: it is the version, no maths.
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            python3 tools/release_version.py stamp "$VERSION"
            echo "tag push -> releasing $TAG as-is"
          else
            # A RE-RUN of a push that already released must reuse its version,
            # not mint a second one. Two shapes count as "already released":
            #   * a tag pointing straight at our commit;
            #   * a tag pointing at the version-bump commit WE made, i.e. a
            #     child of our commit whose subject is "release: vX.Y.Z" (that
            #     is what the commit-back below produces; GITHUB_SHA stays the
            #     pushed commit on a re-run, hence the parent check).
            VERSION=""
            EXISTING_TAG=""
            for t in $(git tag -l 'v*'); do
              case "$t" in v[0-9]*.[0-9]*.[0-9]*) ;; *) continue;; esac
              c="$(git rev-parse -q --verify "$t^{commit}")" || continue
              if [ "$c" = "$GITHUB_SHA" ] \
                 || { [ "$(git rev-parse -q --verify "$c^" || true)" = "$GITHUB_SHA" ] \
                      && [ "$(git log -1 --format=%s "$c")" = "release: v${t#v} [skip ci]" ]; }; then
                VERSION="${t#v}"
                EXISTING_TAG="$t"
                echo "re-run: $t already covers $GITHUB_SHA"
                break
              fi
            done
            [ -n "$VERSION" ] || VERSION="$(python3 tools/release_version.py next)"

            # Stamp the tree so the tag's own source matches the tag, and commit
            # it back ([skip ci] -> no recursive run). The push rides on the
            # token actions/checkout persisted (its default); best effort on the
            # push anyway: a protected branch may refuse it, and every build job
            # stamps its own checkout regardless, so the artifacts stay correct
            # either way.
            python3 tools/release_version.py stamp "$VERSION"
            SHA="$GITHUB_SHA"
            if ! git diff --quiet; then
              git commit -q -a -m "release: v$VERSION [skip ci]"
              if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
                SHA="$(git rev-parse HEAD)"
              else
                echo "::warning::could not push the v$VERSION bump to ${GITHUB_REF_NAME}; tagging $SHA without it"
                git reset -q --hard "$GITHUB_SHA"
              fi
            fi

            if [ -n "$EXISTING_TAG" ]; then
              # Our version is already out (a re-run). Do NOT reserve again: the
              # tag points at this push's bump commit, not at $SHA, so the lock
              # below would read it as a collision and skip a version for free.
              TAG="$EXISTING_TAG"
            else
              # Reserve the tag. Creating a ref is atomic server-side, so this is
              # the lock that makes concurrent runs pick different versions: the
              # loser's push is rejected and it bumps past the winner.
              attempts=0
              while true; do
                attempts=$((attempts + 1))
                if [ "$attempts" -gt 10 ]; then
                  echo "::error::could not reserve a tag for v$VERSION"
                  exit 1
                fi
                TAG="v$VERSION"
                if reserve_tag "$SHA" "$TAG"; then
                  echo "tagged $SHA as $TAG"
                  break
                else
                  result=$?
                  [ "$result" -eq 2 ] || exit 1
                fi
                echo "::warning::$TAG was taken meanwhile; trying the next version"
                VERSION="$(python3 tools/release_version.py bump "$VERSION")"
              done
            fi
          fi

          # Draft first: /releases/latest ignores drafts, so the updater and the
          # download worker keep pointing at the previous release until every
          # asset is up and `publish` has verified them.
          #
          # CHANNEL decides whether this is a stable (patch zero or an explicit
          # maintainer promotion) or a beta.
          # A beta is created as a GitHub PRERELEASE, which is what keeps it out
          # of /releases/latest - the home page, the download Worker and the
          # default updater all read that endpoint, so a beta cannot leak onto
          # the site even if its assets are already public.
          CHANNEL="$(python3 tools/release_version.py channel "$VERSION")"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "$TAG is a $CHANNEL release"
          #
          # NB: look the release up with `gh release view`, NOT the
          # `releases/tags/<tag>` API endpoint: that endpoint returns 404 for a
          # DRAFT (learned the hard way on the first real run - it made the
          # re-run path try to re-create the release and die on "already
          # exists"). gh's own commands list-and-match, so they see drafts.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "release $TAG already exists (re-run) - reusing it"
            # ...and put it BACK into draft for the re-upload: --clobber deletes
            # an asset before re-uploading it, so re-running a published release
            # would otherwise leave a window where /releases/latest points at a
            # release whose binary is missing. `publish` re-publishes at the end.
            gh release edit "$TAG" --draft=true
            if [ "$CHANNEL" = "beta" ]; then
              gh release edit "$TAG" --prerelease
            else
              gh release edit "$TAG" --prerelease=false --title "Cubeon $TAG"
            fi
          elif [ "$CHANNEL" = "beta" ]; then
            gh release create "$TAG" \
              --title "Cubeon $TAG (beta)" \
              --draft \
              --prerelease \
              --verify-tag \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "Cubeon $TAG" \
              --draft \
              --verify-tag \
              --generate-notes
          fi

          # Fail fast. Everything downstream rides on the token being able to
          # SEE its own draft release; if that ever stops being true, say so now
          # instead of after three platforms have built and every
          # `gh release upload` fails.
          gh release view "$TAG" --json tagName >/dev/null

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-linux-appimage:
    name: Build Linux AppImage
    needs: release
    # Keep the bundled interpreter compatible with pre-AVX2 x86-64 CPUs.
    # Rolling runners can switch to an x86-64-v3 distro/interpreter build.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # Shared by every publish step below; the release job owns the value.
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The tagged commit, not the pushed one: the release job committed the
          # version bump and tagged THAT, so this is where the tree, the tag and
          # the built binaries all agree. (GITHUB_REF is untouched, so the
          # tag-only artifact steps below stay tag-only.)
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          # A runner's regional mirror can fail DNS temporarily. Retry, then
          # use Ubuntu's canonical mirrors if the index is still unavailable.
          if ! sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update; then
            for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if [ -f "$apt_source" ]; then
                sudo sed -i -E \
                  's@https?://([a-z0-9.-]+\.)?archive.ubuntu.com/ubuntu/?@http://archive.ubuntu.com/ubuntu/@g; s@https?://security.ubuntu.com/ubuntu/?@http://security.ubuntu.com/ubuntu/@g; s@mirror\+file:/etc/apt/apt-mirrors.txt@http://archive.ubuntu.com/ubuntu/@g; s@mirror\+file:/etc/apt/apt-mirrors-security.txt@http://security.ubuntu.com/ubuntu/@g' \
                  "$apt_source"
              fi
            done
            sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
          fi
          # The bundled Flet client needs runtime libraries. GStreamer development
          # packages pull libunwind-dev and conflict with Jammy's runner LLVM setup.
          sudo apt-get -o Acquire::Retries=3 install -y libfuse2 libgtk-3-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 qemu-user

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp the release version
        # Before the build, always: the AppImage's updater and installer names
        # both read APP_VERSION out of the tree they are built
        # from, and a mismatch with RELEASE_TAG nags every user forever.
        run: python3 tools/release_version.py stamp "$RELEASE_VERSION"

      - name: Inject the CurseForge API key
        # One key for every user, and never in the repository (it is public).
        # It is written to cubeon/_cf_key.py, which is gitignored, right before
        # PyInstaller compiles the tree into the bundle. No secret -> the build
        # is still valid and ships the curated CurseForge classics.
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 tools/write_cf_key.py

      - name: Build Linux AppImage
        env:
          CUBEON_REQUIRE_CPU_CHECK: "1"
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh
          python packaging/build_linux_installers.py
          python tools/release_version.py blockmap "dist/Cubeon-${RELEASE_VERSION}-Linux-x86_64.AppImage" --kind linux

      - name: Upload Linux AppImage Artifact
        # Publish artifacts only for tagged releases. A single run's
        # artifacts (AppImage + Windows installer + macOS bundle) are ~400-500 MB,
        # which is the WHOLE free Actions storage quota - uploading them on
        # every main push filled it up (19 GB of stale builds) and then made
        # every upload fail with "Artifact storage quota has been hit".
        # Branch runs still BUILD (so the build itself stays verified); only
        # releases keep the binaries. Release ASSETS are exempt - see below.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: Cubeon-${{ needs.release.outputs.version }}-Linux-x86_64-AppImage
          path: dist/Cubeon-${{ needs.release.outputs.version }}-Linux-x86_64.AppImage

      - name: Attach Linux AppImage to the GitHub release
        # Release ASSETS do not count against the Actions artifact storage
        # quota (artifacts do, and the free quota is smaller than one run's
        # builds). The draft release already exists - the `release` job made it.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/Cubeon-${RELEASE_VERSION}-Linux-x86_64.AppImage" "dist/Cubeon-${RELEASE_VERSION}-Linux-x86_64.AppImage.blockmap.json" --clobber

      - name: Attach Linux offline installer to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/Cubeon-${RELEASE_VERSION}-Linux-x86_64-Setup.sh" --clobber

  build-windows-exe:
    name: Build Windows installer
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install NSIS
        # choco drops NSIS in "C:\Program Files (x86)\NSIS" but does NOT
        # refresh PATH inside the running job. build_windows_installer.py
        # looks makensis up with shutil.which(), so without the GITHUB_PATH
        # line every Windows installer build died with "NSIS not found" (the
        # ZIP had already been built, which is why the job failed only after
        # the zipping line).
        run: |
          choco install nsis -y --no-progress
          $candidates = @(
            (Join-Path ${env:ProgramFiles} 'NSIS'),
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS')
          )
          $dir = $candidates | Where-Object {
            Test-Path (Join-Path $_ 'makensis.exe')
          } | Select-Object -First 1
          if (-not $dir) { throw "makensis.exe not found after choco install" }
          Write-Host "makensis: $(Join-Path $dir 'makensis.exe')"
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Stamp the release version
        # Before the build: the frozen updater reports this string, and
        # build_windows_installer.py reads the same literal for the exe's
        # version resource. `python`, not `python3` - the Windows runner has
        # no python3.exe (this job's other steps use `python` too).
        shell: bash
        run: python tools/release_version.py stamp "$RELEASE_VERSION"

      - name: Inject the CurseForge API key
        # One key for every user, and never in the repository (it is public).
        # It is written to cubeon/_cf_key.py, which is gitignored, right before
        # PyInstaller compiles the tree into the bundle. No secret -> the build
        # is still valid and ships the curated CurseForge classics.
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        shell: bash
        run: python tools/write_cf_key.py

      - name: Test Windows installer transactions
        run: |
          python tools/test_launcher_installers.py --native-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_auto_update.py --native-windows

      - name: Build Windows installer payload
        run: python packaging/build_windows.py

      - name: Build Windows installer (NSIS)
        run: |
          python packaging/build_windows_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_version.py blockmap "dist/Cubeon-${env:RELEASE_VERSION}-Windows-x64-Setup.exe" --kind windows

      - name: Publish Windows installer to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "dist/Cubeon-${RELEASE_VERSION}-Windows-x64-Setup.exe" "dist/Cubeon-${RELEASE_VERSION}-Windows-x64-Setup.exe.blockmap.json" --clobber

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Stamp the release version
        shell: bash
        run: python tools/release_version.py stamp "$RELEASE_VERSION"

      - name: Inject the CurseForge API key
        # One key for every user, and never in the repository (it is public).
        # It is written to cubeon/_cf_key.py, which is gitignored, right before
        # PyInstaller compiles the tree into the bundle. No secret -> the build
        # is still valid and ships the curated CurseForge classics.
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: python3 tools/write_cf_key.py

      - name: Build macOS app bundle
        run: |
          chmod +x packaging/build_macos.sh
          ./packaging/build_macos.sh

      - name: Verify macOS bundle and native startup
        run: python tools/test_macos_package.py --native --arch "${{ matrix.arch }}"

      - name: Publish macOS app to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" "dist/Cubeon-${RELEASE_VERSION}-macOS-${{ matrix.arch }}.dmg" "dist/Cubeon-${RELEASE_VERSION}-macOS-${{ matrix.arch }}.zip" --clobber

  publish:
    name: Verify assets + publish the release
    needs: [ release, build-linux-appimage, build-windows-exe, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify every asset landed
        # A release that goes public missing a binary is worse than a late
        # release: /releases/latest feeds the in-app updater AND
        # worker/cubeon-downloads.js, so the offer would 404 for every user on
        # the new version. Assert instead of hoping.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Resolve the draft with gh first; the REST API includes upload
          # state and GitHub digests, which gh's asset projection omits.
          release_api="$(gh release view "$TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api" > build/release-assets.json
          python3 tools/release_version.py manifest "${TAG#v}" \
            --release-json build/release-assets.json --repository "$GITHUB_REPOSITORY" \
            --channel "$CHANNEL" --require-blockmaps
          gh release upload "$TAG" "dist/update-${TAG#v}.json" --clobber

      - name: Publish
        # Un-draft last. A beta is published as a PRERELEASE and is never made
        # "latest": GitHub already keeps prereleases out of /releases/latest,
        # and asking for --latest on one is at best redundant. A stable takes
        # --latest only when it is ahead of what is already PUBLIC:
        # re-publishing an older release (a re-run after a failed build) must
        # not move /releases/latest backwards, or the download links would
        # silently offer the older build. Our own release is still a draft
        # here, so it is not in this list.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "beta" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
            echo "published $TAG as a beta (prerelease): hidden from /releases/latest"
          else
            highest="$(gh release list --limit 300 --json tagName,isDraft \
                       --jq '.[] | select(.isDraft == false) | .tagName' \
                       | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            newest="$(printf '%s\n%s\n' "${highest#v}" "${TAG#v}" | sort -V | tail -1)"
            if [ -z "$highest" ] || [ "$newest" = "${TAG#v}" ]; then
              gh release edit "$TAG" --draft=false --prerelease=false --title "Cubeon $TAG" --latest
            else
              echo "$TAG is not ahead of the public $highest; publishing without --latest"
              gh release edit "$TAG" --draft=false --prerelease=false --title "Cubeon $TAG" --latest=false
            fi
          fi
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,url
          # Closing summary. `gh release view` has no isLatest field, so ask the
          # API instead - and this is the very endpoint the updater and the
          # download worker read, so the line states what users are actually
          # being offered right now.
          echo "public /releases/latest is $(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
