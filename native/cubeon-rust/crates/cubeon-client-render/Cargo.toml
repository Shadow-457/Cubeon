[package]
name = "cubeon-client-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's world data, rendering and screens: chunks, meshing, light, streaming, the renderer, the HUD, menus and settings; no gameplay"

[dependencies]
cubeon-cosmetics = { path = "../cubeon-cosmetics" }
# The GUI atlas's pixels, kept compressed once uploaded (hud.rs `pack_pixels`).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
cubeon-assets = { path = "../cubeon-assets" }
cubeon-bench = { path = "../cubeon-bench" }
cubeon-client-core = { path = "../cubeon-client-core" }
cubeon-client-input = { path = "../cubeon-client-input" }
cubeon-command = { path = "../cubeon-command" }
cubeon-core = { path = "../cubeon-core" }
cubeon-hdr = { path = "../cubeon-hdr" }
cubeon-items = { path = "../cubeon-items" }
# The narrator option's status and whether the narrator is there (Options.narrator).
cubeon-narrator = { path = "../cubeon-narrator" }
# OptiFine-format pack files: random entity textures (hud.rs), connected textures
# (connected.rs) and custom item texture rules (cit.rs).
cubeon-optifine = { path = "../cubeon-optifine" }
cubeon-protocol = { path = "../cubeon-protocol" }
cubeon-shader-api = { path = "../cubeon-shader-api" }
cubeon-shaders = { path = "../cubeon-shaders" }
cubeon-telemetry = { path = "../cubeon-telemetry", default-features = false }
cubeon-theme = { path = "../cubeon-theme" }
cubeon-threads = { path = "../cubeon-threads" }
cubeon-world = { path = "../cubeon-world" }
ab_glyph = "0.2.32"
base64 = "0.22"
bytemuck = { version = "1.24", features = ["derive"] }
# Sound (ALSA on Linux); the `audio` feature.
cpal = { version = "0.16", optional = true }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
naga = { version = "30.0.1", features = ["wgsl-in", "glsl-in", "hlsl-out"] }
half = "2"
png = "0.18"
# Project icons served by Modrinth are often WebP or JPEG rather than PNG, and
# the pack browser showed nothing for those. Both are small pure-Rust decoders.
image-webp = { version = "0.2", default-features = false }
zune-jpeg = { version = "0.4", default-features = false, features = ["std"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10.9"
smallvec = { version = "1", features = ["const_new"] }
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis"] }
unicode-bidi = "0.3.18"
ureq = { version = "2", default-features = false, features = ["tls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[features]
# Sound output: cubeon-client's `audio` feature.
audio = ["dep:cpal"]
# Helpers cubeon-client's tests build their fixtures with.
test-support = []

[build-dependencies]
cubeon-mod-api-gen = { path = "../cubeon-mod-api-gen" }

[lints]
workspace = true

[dev-dependencies]
cubeon-items = { path = "../cubeon-items", features = ["test-support"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "glsl-out", "msl-out", "spv-out"] }
