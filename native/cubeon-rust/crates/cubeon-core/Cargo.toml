[package]
name = "cubeon-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cubeon simulation foundations for the pinned vanilla Java Edition target"

[features]
# Records the call sites of LegacyRandom draws (mob AI parity debugging).
rng-trace = []

[dependencies]
libm = "=0.2.16"

[[bin]]
name = "cubeon-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "cubeon-tick-parity"
path = "src/bin/tick_parity.rs"

[[bin]]
name = "cubeon-geometry-parity"
path = "src/bin/geometry_parity.rs"

[[bin]]
name = "cubeon-noise-parity"
path = "src/bin/noise_parity.rs"

[[bin]]
name = "cubeon-density-parity"
path = "src/bin/density_parity.rs"

[[bin]]
name = "cubeon-float-log-parity"
path = "src/bin/float_log_parity.rs"

[lints]
workspace = true
