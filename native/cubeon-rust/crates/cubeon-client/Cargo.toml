[package]
name = "cubeon-client"
default-run = "cubeon-rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Cubeon native development client"
autobins = false
autoexamples = false
autotests = false

[dependencies]
cubeon-cosmetics = { path = "../cubeon-cosmetics" }
cubeon-client-lib = { path = "../cubeon-client-lib", default-features = false }
cubeon-assets = { path = "../cubeon-assets" }
cubeon-client-core = { path = "../cubeon-client-core" }
cubeon-client-input = { path = "../cubeon-client-input" }
cubeon-client-render = { path = "../cubeon-client-render" }
cubeon-command = { path = "../cubeon-command" }
cubeon-items = { path = "../cubeon-items" }
cubeon-core = { path = "../cubeon-core" }
# OptiFine-format pack files: custom entity models, random entity textures.
cubeon-optifine = { path = "../cubeon-optifine" }
# The server thread ahead of the workers (MinecraftServer.spin's Thread.setPriority).
cubeon-threads = { path = "../cubeon-threads" }
cubeon-hdr = { path = "../cubeon-hdr" }
cubeon-world = { path = "../cubeon-world" }
cubeon-protocol = { path = "../cubeon-protocol" }
# server.properties, eula.txt and the user lists, shared with cubeon-server.
cubeon-server-files = { path = "../cubeon-server-files" }
# The dedicated server's anticheat, off unless server.toml's [anticheat] turns it on (docs/anticheat.md).
cubeon-anticheat = { path = "../cubeon-anticheat" }
# The dedicated server's chat filter: [chat_filter], the slur list, mutes (docs/chat-filter.md).
cubeon-chat-filter = { path = "../cubeon-chat-filter" }
# Shader packs: reading them and turning their GLSL into naga modules.
cubeon-shaders = { path = "../cubeon-shaders" }
# Cubeon's own shader packs: the format, the stages and the check (docs/shaders.md).
cubeon-shader-api = { path = "../cubeon-shader-api" }
cubeon-friends = { path = "../cubeon-friends" }
# The narrator (GameNarrator): text-to-speech of chat, system messages and screens.
cubeon-narrator = { path = "../cubeon-narrator" }
# Cubeon mods: sandboxed WebAssembly components, off unless installed and turned on (docs/mods.md).
# Their runtime is the `mods` feature.
cubeon-mods = { path = "../cubeon-mods", default-features = false, features = ["index"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "wgsl", "naga-ir"] }
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
# Server resource packs are checked and cached by their SHA-1, as vanilla does.
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
# hlsl-out: the gfx.rs tests translate every shader as wgpu's DirectX 12 backend does. A normal feature,
# not a dev-dependency's, so builds, tests and examples share one build of naga, wgpu and this crate.
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
miniz_oxide = "0.8"
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
cubeon-theme = { path = "../cubeon-theme" }
# Opt-in data collection: the game keeps, the launcher sends (docs/telemetry.md); `live` is
# the anonymous "I'm playing" ping the game sends itself (`heartbeat.rs`).
cubeon-telemetry = { path = "../cubeon-telemetry", default-features = false }
cubeon-bench = { path = "../cubeon-bench" }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
# Controllers (evdev + libudev on Linux, IOKit on macOS, Windows.Gaming.Input); the `controllers` feature.
gilrs = { version = "0.11", optional = true }
# The DualSense's rumble, adaptive triggers and lights over HID (gilrs only reads it).
cubeon-dualsense = { path = "../cubeon-dualsense", optional = true }
# HTTPS to the Minecraft services (online-mode session join).
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-bidi = "0.3.18"
# `LevelStorageAccess.estimateDiskSpace`: usable disk space, without unsafe code on Windows.
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# The server thread's CPU time per tick (`CUBEON_SPIKES`, spans.rs).
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }

[target.'cfg(windows)'.dependencies]
# Use the registered URI handler without routing links through Explorer/cmd.
open = { version = "5.4.5", features = ["shellexecute-on-windows"] }
# DirectX 12, where Vulkan has no adapter or device, or by choice (`graphicsApi`, graphics.rs).
# Shaders compile with FXC (d3dcompiler_47.dll, part of Windows), or DXC when dxcompiler.dll is
# on the PATH.
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Splitscreen: a window filling a monitor goes over its menu bar (game/split/windows.rs
# `above_menu_bar`); all already in the tree through winit and wgpu.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSScreen"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# OpenGL (WGL on Windows, EGL on Linux), the last fallback, for GPUs with no Vulkan or
# DirectX 12 driver (`graphicsApi`, graphics.rs).
wgpu = { version = "30.0.1", default-features = false, features = ["gles"] }

[target.'cfg(windows)'.build-dependencies]
# The icon resource in the .exe (build.rs).
winresource = "0.1"

[features]
default = ["audio"]
# Sound output. Without it (and `controllers`) the program links neither libasound nor libudev on
# Linux: the server build (`--no-default-features`, released as cubeon-engine; docs/server.md).
audio = ["cubeon-client-render/audio", "cubeon-client-lib/audio"]
# Controllers: gilrs, and the DualSense's own output. Without it only `cubeon-ctl pad`'s virtual pad.
controllers = ["cubeon-client-lib/controllers", "dep:gilrs", "dep:cubeon-dualsense", "cubeon-client-input/controllers"]
# Records the call sites of mob random draws (`mob_ai_probe` traces).
rng-trace = ["cubeon-core/rng-trace", "cubeon-client-lib/rng-trace"]
# Rust's allocations go to the system heap instead of mimalloc, where heap profilers that replace
# malloc (heaptrack, valgrind's massif) see them. For profiling only: mimalloc is faster.
system-allocator = []
# mimalloc with a tag on each block: `cubeon-ctl memory` lists the live heap by startup step and
# thread (`heap_by_tag_mb`). For measuring only: each block costs 16 bytes more.
alloc-census = ["cubeon-threads/alloc-census"]
# Compatibility with earlier experiment commands: main already uses mimalloc.
windows-mimalloc = []
# Opt-in Windows heap experiment; see docs/windows-allocators.md.
windows-segment-heap = []

[[bin]]
name = "cubeon-rust"
path = "src/main.rs"

[[test]]
name = "datapack_biome_sync"
path = "tests/datapack_biome_sync.rs"

[[test]]
name = "launch_api"
path = "tests/launch_api.rs"

[[test]]
name = "mod_api_hooks"
path = "tests/mod_api_hooks.rs"

[build-dependencies]
cubeon-mod-api-gen = { path = "../cubeon-mod-api-gen" }

[lints]
workspace = true

[dev-dependencies]
cubeon-client-render = { path = "../cubeon-client-render", features = ["test-support"] }
cubeon-items = { path = "../cubeon-items", features = ["test-support"] }
# Every WGSL shader translated as wgpu's DirectX 12 backend does (gfx.rs tests).
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out", "msl-out", "spv-out"] }
