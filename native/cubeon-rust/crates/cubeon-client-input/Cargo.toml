[package]
name = "cubeon-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
cubeon-client-core = { path = "../cubeon-client-core" }
winit = "0.30.13"
# The window icon.
cubeon-theme = { path = "../cubeon-theme" }
png = "0.18"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# The DualSense's trigger effects (the `controllers` feature).
cubeon-dualsense = { path = "../cubeon-dualsense", optional = true }

[features]
controllers = ["dep:cubeon-dualsense"]

[lints]
workspace = true
