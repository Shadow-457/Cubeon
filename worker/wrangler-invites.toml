name = "cubeon-invites"
main = "cubeon-invites.js"
compatibility_date = "2025-04-01"

[[kv_namespaces]]
binding = "INVITES"
id = "837c3f4a586047d69eba373fc6f9f602"

# Rate limiting: cubeon-invites.js gates the one write route (PUT) per IP, and
# it does so in-isolate whether or not this binding is present - so a flood is
# damped from the first deploy instead of only after someone notices. The
# binding makes that limit per-POP and durable across isolate recycling
# (Cloudflare's Rate Limiting, GA - wrangler >= 4.36.0). `namespace_id` is
# unique per binding across the account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 20
  period = 60