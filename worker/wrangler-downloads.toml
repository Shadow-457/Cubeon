# Cubeon download proxy - Cloudflare Worker (free tier, no VPS).
#
# The repository is PRIVATE, so GitHub's release URLs answer visitors with an
# auth wall and any signed asset URL expires within an hour. This Worker holds
# a read-only GitHub token as a secret and streams the latest release's
# installer files directly, with no expiry and no GitHub page.
#
# Deploy (no KV, no account setup beyond what already exists):
#
#   cd worker
#   npx wrangler deploy -c wrangler-downloads.toml
#   echo "<read-only token>" | npx wrangler secret put GITHUB_TOKEN -c wrangler-downloads.toml
#
# web/vercel.json points the /<os>download routes at the URL this prints.
#
# ABUSE (see the header of cubeon-downloads.js): the release lookup is
# edge-cached for 5 minutes, which is what stops a flood from spending the
# token's API budget. The per-IP throttle below is the optional second gate -
# uncomment it to add one, and re-deploy. Without it the Worker is unthrottled
# but still cannot burn the quota, because the cache absorbs the traffic.
#
#   [[unsafe.bindings]]
#   name = "RATE_LIMITER"
#   type = "ratelimit"
#   namespace_id = "1001"
#   simple = { limit = 30, period = 60 }

name = "cubeon-downloads"
main = "cubeon-downloads.js"
compatibility_date = "2025-04-01"
