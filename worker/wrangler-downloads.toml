# Cubeon download proxy - Cloudflare Worker (free tier, no VPS).
#
# The repository is PRIVATE, so GitHub's release URLs answer visitors with an
# auth wall and any signed asset URL expires within an hour. This Worker holds
# a read-only GitHub token as a secret and streams the latest release's
# installer files directly, with no expiry and no GitHub page.
#
# Deploy (no KV, no account setup beyond what already exists):
#
#   cd worker
#   npx wrangler deploy -c wrangler-downloads.toml
#   echo "<read-only token>" | npx wrangler secret put GITHUB_TOKEN -c wrangler-downloads.toml
#
# web/vercel.json points the /<os>download routes at the URL this prints.
#
# ABUSE (see the header of cubeon-downloads.js): the release lookup is
# edge-cached for 5 minutes, which is what stops a flood from spending the
# token's API budget - that quota is genuinely unreachable.
#
# The Worker *request* budget is a different story: it is 100k/day for the
# whole account, shared with the other four Workers. A flood here is one
# request each (the cached lookup does not refund them), so it can take friend
# requests, skins and signups down with it for the rest of the UTC day. Both
# gates are therefore live now:
#
#   * cubeon-downloads.js runs an in-isolate 30/min/IP limiter whether or not
#     the binding is present.
#   * The RATE_LIMITER binding below (Cloudflare's Rate Limiting, GA - wrangler
#     >= 4.36.0) makes that per-POP and durable across isolate recycling.
#     `namespace_id` is unique per binding across the account.

name = "cubeon-downloads"
main = "cubeon-downloads.js"
compatibility_date = "2025-04-01"

# 30 downloads/min/IP is far above any honest use (a person grabs one or two
# installers) and puts a ceiling under a flood of the shared request budget.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1004"

  [ratelimits.simple]
  limit = 30
  period = 60
