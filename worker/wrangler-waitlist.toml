# Cubeon waitlist API - Cloudflare Worker + KV.
#
# One-time setup (creates the KV namespace and prints its id):
#
#   cd worker
#   npx wrangler kv namespace create WAITLIST
#
# Paste the printed id into the `id = "..."` line below, then deploy:
#
#   npx wrangler deploy -c wrangler-waitlist.toml
#
# Cloudflare runs it - there is no server to host, patch, or pay for. Copy the
# URL it prints into WAITLIST_ENDPOINT in web/index.html to make the site's
# "N in line" counter real and shared. Until then the site uses a local
# placeholder count and still works.
#
# Local run for testing:  npx wrangler dev -c wrangler-waitlist.toml
#   GET  count:  curl http://127.0.0.1:8787/
#   POST join:   curl -X POST http://127.0.0.1:8787/ -d '{"email":"you@example.com"}'
#
# ABUSE (see the POST branch of cubeon-waitlist.js): this is the only Worker
# whose writes carry no identity, so a script can post made-up addresses until
# the free tier's account-wide ~1k writes/day runs out - which answers 429 for
# every REAL signup too, and for the count and the skins Worker, which draw on
# the same account-wide budget. Two gates, both live:
#
#   * cubeon-waitlist.js runs an in-isolate 5/min/IP limiter whether or not the
#     binding is present, so one host cannot drain the day's writes in a burst.
#   * The RATE_LIMITER binding below makes that limit per-POP and durable
#     across isolate recycling. Re-deploy with this file to pick it up.

name = "cubeon-waitlist"
main = "cubeon-waitlist.js"
compatibility_date = "2025-04-01"

# Cloudflare's Rate Limiting (GA; needs wrangler >= 4.36.0). Per-POP, and it
# survives isolate recycling - which the in-code fallback cannot do.
# `namespace_id` must be unique per binding across the account, or an unrelated
# Worker's counters are shared with these.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Signups + the running tally. Replace id with the one `wrangler kv namespace
# create WAITLIST` prints. (For a separate preview environment, also set
# preview_id; not required for a single production deploy.)
[[kv_namespaces]]
binding = "WAITLIST"
id = "beeff1c166b74248a68c7b2b00c7a264"
